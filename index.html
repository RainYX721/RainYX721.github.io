<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人介绍页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
        body{background:#f7f8fa;color:#222;line-height:1.6;}
        .container{max-width:800px;margin:0 auto;padding:30px 20px;}
        .hero{text-align:center;padding:40px 0;border-bottom:1px solid #eee;}
        .hero h1{font-size:28px;margin-bottom:8px;}
        .hero p{color:#666;font-size:18px;}
        section{margin:40px 0;}
        section h2{font-size:22px;border-left:4px solid #4080ff;padding-left:10px;margin-bottom:16px;}
        .skill-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .skill-item{background:#fff;padding:14px;border-radius:8px;box-shadow:0 2px 6px #00000010;}
        .project-card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #00000010;margin-bottom:18px;}
        .project-card h3{margin-bottom:6px;}
        .project-card a{color:#4080ff;text-decoration:none;}
        footer{text-align:center;color:#777;padding-top:20px;border-top:1px solid #eee;}
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>RainYX721</h1>
            <p>Web前端学习者｜对电商直播感兴趣</p>
        </div>

        <section>
            <h2>关于我</h2>
            <p>专科，学习Web前端，掌握HTML、CSS、JavaScript、Vue基础。
            同时学习直播带货运营，希望积累实战经验。</p>
        </section>

        <section>
            <h2>技能</h2>
            <div class="skill-list">
                <div class="skill-item">✅ HTML / CSS</div>
                <div class="skill-item">✅ JavaScript</div>
                <div class="skill-item">✅ Vue基础</div>
                <div class="skill-item">✅ 直播运营</div>
            </div>
        </section>

        <section>
            <h2>项目作品</h2>
            <div class="project-card">
                <h3>个人介绍网页</h3>
                <p>技术：HTML + CSS，适配手机端</p>
                <a href="#">在线预览</a>
            </div>
        </section>

        <footer>
            <p>联系我</p>
        </footer>
    </div>
</body>
</html>
